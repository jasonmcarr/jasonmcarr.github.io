name: Generate transparent sage favicon files (one-time)

on:
  push:
    branches:
      - fix/transparent-sage-favicon
    paths:
      - .github/workflows/generate-transparent-sage-icons.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering libraries
        run: python -m pip install --disable-pip-version-check "CairoSVG>=2.7,<3" "Pillow>=10,<12"
      - name: Render with alpha transparency
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import cairosvg

          source = Path("public/favicon.svg")
          assert '<rect' not in source.read_text(), 'SVG still has its background rectangle'
          def render(size):
              png = cairosvg.svg2png(url=str(source),output_width=size,output_height=size)
              img = Image.open(BytesIO(png)).convert("RGBA")
              assert img.size == (size,size)
              for xy in [(0,0),(size-1,0),(0,size-1),(size-1,size-1)]:
                  assert img.getpixel(xy)[3] == 0, f"Nontransparent corner {xy} at size {size}"
              cx = img.getpixel((size//2,size//2))
              assert cx[3] == 255 and cx[1] > cx[0] and cx[1] > cx[2], f"Missing opaque green shield at size {size}: {cx}"
              return img
          for name,size in [
              ("favicon-16x16.png",16),
              ("favicon-32x32.png",32),
              ("apple-touch-icon.png",180),
              ("logo192.png",192),
              ("logo512.png",512)
          ]:
              image=render(size)
              image.save(Path("public")/name,format="PNG",optimize=True)
              print(name,"transparent corners and opaque emblem verified")
          render(256).save("public/favicon.ico",format="ICO",sizes=[(16,16),(24,24),(32,32),(48,48),(64,64)])
          with Image.open("public/favicon.ico") as ico:
              assert ico.format=="ICO"
              assert ico.convert("RGBA").getpixel((0,0))[3]==0, "ICO background is not transparent"
              print("favicon.ico transparency verified")
          PY
      - name: Commit updated transparent assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.ico public/favicon-16x16.png public/favicon-32x32.png public/apple-touch-icon.png public/logo192.png public/logo512.png
          git diff --cached --quiet && { echo "No image changes"; exit 0; }
          git commit -m "Generate transparent sage favicon and app icon bitmaps"
          git push origin HEAD:fix/transparent-sage-favicon
