name: Generate sage favicon assets (one-time)

on:
  push:
    branches:
      - feature/sage-green-favicon
    paths:
      - .github/workflows/generate-sage-favicon.yml

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check "CairoSVG>=2.7,<3" "Pillow>=10,<12"
      - name: Render browser and installed-app icons
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import cairosvg

          source = Path("public/favicon.svg")
          assert source.is_file()
          def render(size):
              b = cairosvg.svg2png(url=str(source), output_width=size, output_height=size)
              icon = Image.open(BytesIO(b)).convert("RGBA")
              assert icon.size == (size, size)
              return icon

          icons = {
              "favicon-16x16.png": 16,
              "favicon-32x32.png": 32,
              "apple-touch-icon.png": 180,
              "logo192.png": 192,
              "logo512.png": 512,
          }
          for name, size in icons.items():
              image = render(size)
              image.save(Path("public") / name, format="PNG", optimize=True)
              assert image.getpixel((size // 2, size // 2))[1] > 70, f"Missing green emblem in {name}"
              print(f"Generated {name} ({size}x{size})")
          render(256).save("public/favicon.ico", format="ICO", sizes=[(16,16), (24,24), (32,32), (48,48), (64,64)])
          with Image.open("public/favicon.ico") as ico:
              assert ico.format == "ICO", "ICO failed to load"
              assert ico.size == (64,64), "ICO missing largest resolution"
          print("Generated and verified favicon.ico")
          PY
      - name: Commit generated files to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.ico public/favicon-16x16.png public/favicon-32x32.png public/apple-touch-icon.png public/logo192.png public/logo512.png
          git diff --cached --quiet && { echo "Icon outputs already up to date"; exit 0; }
          git commit -m "Generate sage emblem favicon and app icon sizes"
          git push origin HEAD:feature/sage-green-favicon
