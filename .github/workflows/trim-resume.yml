name: Trim blank resume page (one-time)

on:
  push:
    branches:
      - review/resume-remove-blank-page
    paths:
      - .github/workflows/trim-resume.yml

permissions:
  contents: write

jobs:
  trim-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF editor
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<2"
      - name: Verify blank second page, remove it and verify unchanged first page
        run: |
          python - <<'PY'
          import fitz, hashlib, os
          from pathlib import Path

          path = Path("public/documents/Jason-Carr-Resume.pdf")
          doc = fitz.open(path)
          print("Original page count:", doc.page_count)
          assert doc.page_count == 2, "Expected exactly two pages; refusing to modify unexpected PDF"
          first_before = doc[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5), alpha=False)
          before_hash = hashlib.sha256(first_before.samples).hexdigest()
          last = doc[1]
          text_count = len(last.get_text().strip())
          images_count = len(last.get_images(full=True))
          # Sample the whole rendered page to ensure there is no visible content.
          pix = last.get_pixmap(matrix=fitz.Matrix(1,1), alpha=False)
          rgb = pix.samples
          colored_pixels = sum(
              1 for i in range(0, len(rgb), 3)
              if rgb[i] < 245 or rgb[i+1] < 245 or rgb[i+2] < 245
          )
          ratio = colored_pixels / max(1, pix.width * pix.height)
          print(f"Second page: text chars={text_count}, embedded images={images_count}, nonwhite pixels={colored_pixels}, coverage={ratio:.5%}")
          assert text_count == 0 and images_count == 0 and ratio < 0.001, "Page 2 is not blank; refusing to delete"

          doc.delete_page(1)
          target = path.with_suffix(".clean.pdf")
          doc.save(target, garbage=4, deflate=True)
          doc.close()
          with fitz.open(target) as cleaned:
              assert cleaned.page_count == 1
              first_after = cleaned[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5), alpha=False)
              after_hash = hashlib.sha256(first_after.samples).hexdigest()
              assert before_hash == after_hash, "First-page rendering changed; refusing replacement"
              print("Verified single page and pixel-identical first-page rendering")
          os.replace(target, path)
          PY
      - name: Commit only the corrected PDF to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/documents/Jason-Carr-Resume.pdf
          git diff --cached --quiet && { echo "No PDF changes"; exit 0; }
          git commit -m "Remove blank second page from website resume PDF"
          git push origin HEAD:review/resume-remove-blank-page
